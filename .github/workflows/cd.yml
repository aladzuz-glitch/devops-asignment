name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        run: |
          docker login ajdindevopsacr.azurecr.io \
            -u ${{ secrets.ACR_USERNAME }} \
            -p ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        run: |
          docker build \
            -t ajdindevopsacr.azurecr.io/flask-app:v1 .

      - name: Push image
        run: |
          docker push \
            ajdindevopsacr.azurecr.io/flask-app:v1

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ajdin-flask-devops-2026
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ajdindevopsacr.azurecr.io/flask-app:v1